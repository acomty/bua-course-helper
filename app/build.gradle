plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bua.coursehelper'
    compileSdk 34

    defaultConfig {
        applicationId "com.bua.coursehelper"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "3.8"
    }

    // 签名：CI 里通过环境变量提供 keystore；本地没有时退回 debug 签名。
    // 关键：CI 必须用和本地同一个 keystore，否则同学升级会报"签名冲突"。
    // 注意：GitHub Secrets 复制粘贴时很容易带进空格/Tab，这里统一 trim 掉。
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath.trim()).exists()) {
                def storePass = (System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "android").trim()
                def aliasName = (System.getenv("ANDROID_KEY_ALIAS") ?: "androiddebugkey").trim()
                def keyPass = (System.getenv("ANDROID_KEY_PASSWORD") ?: "android").trim()
                storeFile file(ksPath.trim())
                storePassword storePass
                keyAlias aliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            // 有正式 keystore 就用它，否则用 debug 签名（自己用足够）
            signingConfig signingConfigs.release.storeFile != null
                    ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        abortOnError false
    }
}

// 不依赖任何第三方库：网络用 HttpURLConnection，JSON 用系统自带 org.json
// （testImplementation 只在电脑上跑冒烟测试时用到，不会打进 APK）
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
